<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Matrix | 数字化实验室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #39FF14; --glass: rgba(255, 255, 255, 0.03); }
        body { background: #000; color: #E5E5E7; font-family: 'Inter', system-ui, sans-serif; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .neon-text { color: var(--neon); text-shadow: 0 0 12px rgba(57, 255, 20, 0.4); }
        input[type="number"] { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: #fff; border-radius: 10px; padding: 10px; width: 90px; text-align: center;
            outline: none; transition: all 0.3s;
        }
        input[type="number"]:focus { border-color: var(--neon); background: rgba(57, 255, 20, 0.05); }
        .nav-item { transition: all 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item:hover { color: var(--neon); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen pb-32">

    <div class="max-w-2xl mx-auto space-y-8">
        <header class="flex justify-between items-end px-2">
            <div>
                <h1 class="text-xs tracking-[0.4em] text-gray-500 font-bold uppercase mb-1">Iron Matrix Lab</h1>
                <div class="text-2xl font-light">核心看板 <span class="text-[10px] border border-gray-700 px-1 text-gray-500 ml-2">V1.0</span></div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-gray-600 uppercase">当前系统状态</div>
                <div class="neon-text font-mono text-sm">ONLINE // ENCRYPTED</div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <section class="glass-panel p-6">
                <div class="flex justify-between mb-6">
                    <span class="text-[10px] text-gray-500 font-bold tracking-widest uppercase">身体参数</span>
                    <span class="text-[10px] text-gray-500 font-mono">ID: USER-01</span>
                </div>
                <div class="flex gap-4 mb-6">
                    <div class="flex-1">
                        <div class="text-[10px] text-gray-600 mb-2">身高 (CM)</div>
                        <input type="number" id="height" value="175" class="w-full">
                    </div>
                    <div class="flex-1">
                        <div class="text-[10px] text-gray-600 mb-2">体重 (KG)</div>
                        <input type="number" id="weight" value="75" class="w-full">
                    </div>
                </div>
                <div class="pt-4 border-t border-white/5">
                    <div class="text-[10px] text-gray-500 mb-1 font-bold">每日总消耗 (TDEE)</div>
                    <div class="text-3xl font-mono tracking-tighter"><span id="tdee-res">2450</span> <span class="text-xs text-gray-600 font-sans">KCAL</span></div>
                </div>
            </section>

            <section class="glass-panel p-6">
                <div class="text-[10px] text-gray-500 font-bold tracking-widest uppercase mb-6">力量矩阵 (PR)</div>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-400">卧推 Bench</span>
                        <input type="number" id="bp" value="90">
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-400">深蹲 Squat</span>
                        <input type="number" id="sq" value="150">
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-400">硬拉 Deadlift</span>
                        <input type="number" id="dl" value="160">
                    </div>
                </div>
            </section>
        </div>

        <section class="glass-panel p-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10">
                <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M12 2v20M2 12h20M5.4 5.4l13.2 13.2M5.4 18.6L18.6 5.4"/></svg>
            </div>
            <h3 class="text-[10px] text-green-500 font-bold uppercase mb-6 tracking-widest">今日训练建议 (75% 强度)</h3>
            <div id="plan" class="grid grid-cols-1 md:grid-cols-3 gap-6 font-mono">
                </div>
        </section>

        <section class="glass-panel p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">营养实时监控</h3>
                <span class="text-xs font-mono"><span id="prot-count" class="text-white">0</span> / <span id="prot-target">150</span>g PRO</span>
            </div>
            <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden mb-8">
                <div id="prot-bar" class="h-full bg-green-500 shadow-[0_0_10px_#39FF14] transition-all duration-1000" style="width: 0%"></div>
            </div>
            <div class="flex gap-4 overflow-x-auto pb-2 scrollbar-hide">
                <button onclick="addProtein(25)" class="whitespace-nowrap px-4 py-2 rounded-xl border border-white/10 hover:border-green-500 hover:text-green-500 transition-all text-xs font-bold">鸡胸肉 +25g</button>
                <button onclick="addProtein(6)" class="whitespace-nowrap px-4 py-2 rounded-xl border border-white/10 hover:border-green-500 hover:text-green-500 transition-all text-xs font-bold">鸡蛋 +6g</button>
                <button onclick="addProtein(20)" class="whitespace-nowrap px-4 py-2 rounded-xl border border-white/10 hover:border-green-500 hover:text-green-500 transition-all text-xs font-bold">蛋白粉 +20g</button>
            </div>
        </section>
    </div>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass-panel py-4 px-8 flex justify-between items-center shadow-2xl">
        <div class="nav-item text-green-500">
            <span class="text-lg">◈</span>
            <span class="text-[8px] uppercase tracking-tighter">数据</span>
        </div>
        <div class="nav-item text-gray-600" onclick="alert('饮食搜索功能开发中...')">
            <span class="text-lg">◎</span>
            <span class="text-[8px] uppercase tracking-tighter">食谱</span>
        </div>
        <div class="nav-item text-gray-600" onclick="alert('趋势分析开发中...')">
            <span class="text-lg">▣</span>
            <span class="text-[8px] uppercase tracking-tighter">趋势</span>
        </div>
        <div class="nav-item text-gray-600" onclick="resetData()">
            <span class="text-lg">⚙</span>
            <span class="text-[8px] uppercase tracking-tighter">设置</span>
        </div>
    </nav>

    <script>
        let protein = 0;
        const inputs = ['height', 'weight', 'bp', 'sq', 'dl'];

        function initApp() {
            inputs.forEach(id => {
                const el = document.getElementById(id);
                el.addEventListener('input', calculateEverything);
            });
            loadData();
        }

        function calculateEverything() {
            const h = parseFloat(document.getElementById('height').value) || 0;
            const w = parseFloat(document.getElementById('weight').value) || 0;
            const bp = parseFloat(document.getElementById('bp').value) || 0;
            const sq = parseFloat(document.getElementById('sq').value) || 0;
            const dl = parseFloat(document.getElementById('dl').value) || 0;

            const bmr = 10 * w + 6.25 * h - 5 * 25 + 5;
            const tdee = Math.round(bmr * 1.45); // 设定为中等活动强度
            document.getElementById('tdee-res').innerText = tdee || 0;

            const protTarget = Math.round(w * 2);
            document.getElementById('prot-target').innerText = protTarget || 150;
            const percent = Math.min((protein / protTarget) * 100, 100);
            document.getElementById('prot-bar').style.width = percent + '%';

            document.getElementById('plan').innerHTML = `
                <div class="p-4 bg-white/5 rounded-2xl"><div class="text-[8px] text-gray-500 mb-1 uppercase">Bench Press</div><div class="text-xl">${(bp*0.75).toFixed(1)}<small class="text-xs ml-1">kg</small></div></div>
                <div class="p-4 bg-white/5 rounded-2xl"><div class="text-[8px] text-gray-500 mb-1 uppercase">Squat</div><div class="text-xl">${(sq*0.7).toFixed(1)}<small class="text-xs ml-1">kg</small></div></div>
                <div class="p-4 bg-white/5 rounded-2xl"><div class="text-[8px] text-gray-500 mb-1 uppercase">Deadlift</div><div class="text-xl">${(dl*0.8).toFixed(1)}<small class="text-xs ml-1">kg</small></div></div>
            `;
            saveData({h, w, bp, sq, dl, protein});
        }

        function addProtein(amt) {
            protein += amt;
            document.getElementById('prot-count').innerText = protein;
            calculateEverything();
        }

        function saveData(data) { localStorage.setItem('iron_matrix_v3', JSON.stringify(data)); }

        function loadData() {
            const saved = JSON.parse(localStorage.getItem('iron_matrix_v3'));
            if(saved) {
                document.getElementById('height').value = saved.h;
                document.getElementById('weight').value = saved.w;
                document.getElementById('bp').value = saved.bp;
                document.getElementById('sq').value = saved.sq;
                document.getElementById('dl').value = saved.dl;
                protein = saved.protein || 0;
                document.getElementById('prot-count').innerText = protein;
            }
            calculateEverything();
        }

        function resetData() { if(confirm('重置所有本地数据？')) { localStorage.clear(); location.reload(); } }

        window.onload = initApp;
    </script>
</body>
</html>
