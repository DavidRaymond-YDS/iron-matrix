<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Matrix | 数字化健身实验室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #E5E5E7;
            font-family: 'Inter', sans-serif;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
        }
        .neon-text { color: #39FF14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.3); }
        .neon-border { border-color: #39FF14; }
        .progress-ring { transform: rotate(-90deg); }
    </style>
</head>
<body class="p-6 md:p-12">

    <header class="max-w-4xl mx-auto flex justify-between items-end mb-12">
        <div>
            <h1 class="text-xs uppercase tracking-widest text-gray-500 mb-1">Project Iron v1.0</h1>
            <h2 class="text-2xl font-light">你好, <span class="font-semibold">训练者</span></h2>
        </div>
        <div class="text-right">
            <div class="text-xs text-gray-500 uppercase">状态</div>
            <div class="neon-text mono">PR 恢复模式</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <section class="glass-card p-8 flex flex-col items-center justify-center relative overflow-hidden">
            <div class="absolute top-4 left-6 text-[10px] uppercase tracking-tighter text-gray-500">Daily Energy Matrix</div>
            
            <div class="relative flex items-center justify-center mt-4">
                <svg class="progress-ring" width="220" height="220">
                    <circle stroke="rgba(255,255,255,0.05)" stroke-width="8" fill="transparent" r="90" cx="110" cy="110"/>
                    <circle stroke="#39FF14" stroke-width="8" stroke-dasharray="565" stroke-dashoffset="150" stroke-linecap="round" fill="transparent" r="90" cx="110" cy="110"/>
                </svg>
                <div class="absolute text-center">
                    <div class="text-4xl font-bold mono">1,840</div>
                    <div class="text-[10px] text-gray-500 uppercase tracking-widest">剩余卡路里</div>
                </div>
            </div>

            <div class="w-full mt-8 grid grid-cols-3 gap-4 text-center">
                <div>
                    <div class="text-[10px] text-gray-500 mb-1">蛋白质</div>
                    <div class="h-1 bg-gray-800 rounded-full"><div class="h-full bg-green-400 w-2/3 rounded-full"></div></div>
                    <div class="text-xs mt-2 mono">142/210g</div>
                </div>
                <div>
                    <div class="text-[10px] text-gray-500 mb-1">碳水</div>
                    <div class="h-1 bg-gray-800 rounded-full"><div class="h-full bg-blue-400 w-1/2 rounded-full"></div></div>
                    <div class="text-xs mt-2 mono">180/350g</div>
                </div>
                <div>
                    <div class="text-[10px] text-gray-500 mb-1">脂肪</div>
                    <div class="h-1 bg-gray-800 rounded-full"><div class="h-full bg-orange-400 w-1/3 rounded-full"></div></div>
                    <div class="text-xs mt-2 mono">45/80g</div>
                </div>
            </div>
        </section>

        <div class="space-y-6">
            <section class="glass-card p-6">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs uppercase tracking-widest text-gray-500 font-semibold">16:8 轻断食</span>
                    <span class="px-2 py-1 rounded bg-green-900/30 text-green-400 text-[10px]">进食窗口开启</span>
                </div>
                <div class="text-3xl mono mb-2">04:22:15</div>
                <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-green-500 h-full w-3/4"></div>
                </div>
            </section>

            <section class="glass-card p-6">
                <div class="text-xs uppercase tracking-widest text-gray-500 mb-4 font-semibold">核心三大项 PR</div>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm">卧推 (Bench Press)</span>
                        <span class="mono text-lg">90 <span class="text-xs text-gray-500">KG</span></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm">深蹲 (Squat)</span>
                        <span class="mono text-lg">150 <span class="text-xs text-gray-500">KG</span></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm">硬拉 (Deadlift)</span>
                        <span class="mono text-lg text-blue-400">160 <span class="text-xs text-gray-500">KG</span></span>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="max-w-4xl mx-auto mt-8 glass-card p-6">
        <div class="text-xs uppercase tracking-widest text-gray-500 mb-6 font-semibold">力量与体重演化趋势</div>
        <div class="h-32 w-full flex items-end gap-1">
            <div class="flex-1 bg-gray-800 rounded-t h-1/2"></div>
            <div class="flex-1 bg-gray-800 rounded-t h-2/3"></div>
            <div class="flex-1 bg-gray-800 rounded-t h-3/4"></div>
            <div class="flex-1 bg-green-500/50 rounded-t h-4/5 border-t-2 border-green-400"></div>
            <div class="flex-1 bg-green-500/50 rounded-t h-5/6 border-t-2 border-green-400"></div>
            <div class="flex-1 bg-green-500/50 rounded-t h-full border-t-2 border-green-400"></div>
            <div class="flex-1 bg-gray-800 rounded-t h-3/4"></div>
        </div>
    </footer>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-72 h-14 glass-card border border-white/20 flex justify-around items-center px-4">
        <button class="text-green-400">●</button>
        <button class="text-gray-500">◈</button>
        <button class="text-gray-500">▣</button>
        <button class="text-gray-500">⚙</button>
    </nav>

</body>

</html>
