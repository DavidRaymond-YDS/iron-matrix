<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Matrix Ultra | 稳定版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #39FF14; }
        body { background: #000; color: #E5E5E7; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
        input, select { background: #111 !important; border: 1px solid #333 !important; color: #fff !important; padding: 12px !important; border-radius: 8px !important; outline: none !important; width: 100%; font-size: 16px; } /* 16px 防止 iOS 自动放大 */
        input:focus { border-color: var(--neon) !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-active { color: var(--neon); }
        .day-btn.active { background: var(--neon); color: #000; font-weight: bold; }
        .label-mini { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body class="p-4 pb-40">

    <div class="max-w-2xl mx-auto">
        <div id="tab-data" class="tab-content active space-y-6">
            <header class="py-6 text-center"><h1 class="text-2xl font-black italic tracking-tighter uppercase">Body & Strategy</h1></header>
            <section class="glass p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><span class="label-mini">身高 cm</span><input type="number" id="height" placeholder="0" onchange="updateBase()"></div>
                    <div><span class="label-mini">体重 kg</span><input type="number" id="weight" placeholder="0" onchange="updateBase()"></div>
                </div>
                <div><span class="label-mini">碳循环模式</span><select id="carb-cycle" onchange="updateBase()"><option value="none">正常饮食</option><option value="high">高碳 (训练日)</option><option value="low">低碳 (休息日)</option></select></div>
                <div id="strategy-hint" class="text-[10px] text-gray-500 italic p-2"></div>
            </section>
        </div>

        <div id="tab-train" class="tab-content space-y-6">
            <header class="py-6 flex justify-between items-center px-2">
                <h1 class="text-2xl font-black italic tracking-tighter uppercase">Workout</h1>
                <button onclick="addWorkoutRow()" class="bg-white text-black px-4 py-2 rounded-xl text-xs font-bold shadow-lg active:scale-95 transition-transform">+ 新动作</button>
            </header>
            
            <div class="flex justify-between gap-1 overflow-x-auto pb-4 scrollbar-hide">
                <button onclick="switchDay(0)" class="day-btn flex-1 p-2 glass text-[10px]">MON</button>
                <button onclick="switchDay(1)" class="day-btn flex-1 p-2 glass text-[10px]">TUE</button>
                <button onclick="switchDay(2)" class="day-btn flex-1 p-2 glass text-[10px]">WED</button>
                <button onclick="switchDay(3)" class="day-btn flex-1 p-2 glass text-[10px]">THU</button>
                <button onclick="switchDay(4)" class="day-btn flex-1 p-2 glass text-[10px]">FRI</button>
                <button onclick="switchDay(5)" class="day-btn flex-1 p-2 glass text-[10px]">SAT</button>
                <button onclick="switchDay(6)" class="day-btn flex-1 p-2 glass text-[10px]">SUN</button>
            </div>

            <div id="workout-list" class="space-y-4"></div>
            
            <div class="glass p-6 text-center">
                <span class="label-mini">今日总吨位</span>
                <div class="text-3xl font-mono text-green-500 font-bold" id="day-vol">0 <small class="text-xs text-gray-600">KG</small></div>
            </div>
        </div>

        <div id="tab-food" class="tab-content space-y-6">
            <header class="py-6 text-center"><h1 class="text-2xl font-black italic tracking-tighter uppercase">Nutrition</h1></header>
            <section class="glass p-6 space-y-4">
                <div class="flex justify-between items-end"><span class="label-mini">热量</span><span class="font-mono text-lg"><span id="curr-kcal">0</span> / <span id="max-kcal">0</span></span></div>
                <div class="h-1 bg-white/5 rounded-full overflow-hidden"><div id="kcal-bar" class="h-full bg-white transition-all w-0"></div></div>
                <div class="grid grid-cols-3 gap-2 text-center text-[10px]">
                    <div class="glass p-2">蛋白<div id="p-stat" class="text-white font-bold text-xs">0g</div></div>
                    <div class="glass p-2">碳水<div id="c-stat" class="text-white font-bold text-xs">0g</div></div>
                    <div class="glass p-2">脂肪<div id="f-stat" class="text-white font-bold text-xs">0g</div></div>
                </div>
            </section>
            <section class="glass p-6">
                <input type="text" id="food-search" placeholder="🔍 搜索食物 (如: 鸡胸肉)" oninput="searchFood()">
                <div id="food-results" class="mt-4 space-y-4"></div>
            </section>
        </div>
    </div>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass p-4 px-8 flex justify-around items-center z-50 shadow-2xl">
        <button onclick="showTab('data')" id="nav-data" class="nav-item flex flex-col items-center gap-1"><span>📈</span><span class="text-[8px] uppercase">策略</span></button>
        <button onclick="showTab('train')" id="nav-train" class="nav-item flex flex-col items-center gap-1"><span>🏋️</span><span class="text-[8px] uppercase">训练</span></button>
        <button onclick="showTab('food')" id="nav-food" class="nav-item flex flex-col items-center gap-1"><span>🍗</span><span class="text-[8px] uppercase">饮食</span></button>
        <button onclick="resetData()" class="flex flex-col items-center gap-1 text-red-900"><span>🧹</span><span class="text-[8px] uppercase">重置数据</span></button>
    </nav>

    <script>
        let appData = {
            h: 0, w: 0, carbMode: 'none',
            dailyNutri: { p: 0, c: 0, f: 0, kcal: 0 },
            weeklyWorkouts: [[], [], [], [], [], [], []]
        };
        let currentDay = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;

        const foodDB = [
            { name: "鸡胸肉", p: 31, c: 0, f: 3.6, k: 165 },
            { name: "白米饭", p: 2.6, c: 25.9, f: 0.3, k: 116 },
            { name: "鸡蛋(大)", p: 7, c: 0.6, f: 5, k: 75 },
            { name: "瘦牛肉", p: 26, c: 0, f: 6, k: 158 },
            { name: "燕麦片", p: 12, c: 66, f: 7, k: 367 },
            { name: "蛋白粉", p: 24, c: 2, f: 1.5, k: 120 }
        ];

        function updateBase() {
            appData.h = parseFloat(document.getElementById('height').value) || 0;
            appData.w = parseFloat(document.getElementById('weight').value) || 0;
            appData.carbMode = document.getElementById('carb-cycle').value;
            let bmr = (10 * appData.w + 6.25 * appData.h - 5 * 25 + 5) * 1.4;
            if(appData.carbMode === 'high') bmr *= 1.2;
            if(appData.carbMode === 'low') bmr *= 0.9;
            document.getElementById('max-kcal').innerText = Math.round(bmr);
            updateNutriUI();
            save();
        }

        function switchDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-btn').forEach((b, i) => b.classList.toggle('active', i === day));
            renderWorkouts();
        }

        function addWorkoutRow() {
            appData.weeklyWorkouts[currentDay].push({ id: Date.now(), name: '', weight: '', sets: '', reps: '' });
            renderWorkouts();
        }

        // 核心渲染逻辑：标注重量/组数/次数
        function renderWorkouts() {
            const list = document.getElementById('workout-list');
            list.innerHTML = '';
            let vol = 0;
            appData.weeklyWorkouts[currentDay].forEach(w => {
                const rowVol = (parseFloat(w.weight)||0) * (parseFloat(w.sets)||0) * (parseFloat(w.reps)||0);
                vol += rowVol;
                const div = document.createElement('div');
                div.className = "glass p-4 relative space-y-4";
                div.innerHTML = `
                    <button onclick="delRow(${w.id})" class="absolute top-2 right-4 text-gray-500 text-xl">×</button>
                    <div>
                        <span class="label-mini">动作名称</span>
                        <input type="text" value="${w.name}" onchange="updateW(${w.id},'name',this.value)" placeholder="如: 杠铃深蹲">
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div><span class="label-mini">重量 KG</span><input type="number" value="${w.weight}" onchange="updateW(${w.id},'weight',this.value)" placeholder="0"></div>
                        <div><span class="label-mini">组数</span><input type="number" value="${w.sets}" onchange="updateW(${w.id},'sets',this.value)" placeholder="0"></div>
                        <div><span class="label-mini">次数</span><input type="number" value="${w.reps}" onchange="updateW(${w.id},'reps',this.value)" placeholder="0"></div>
                    </div>
                `;
                list.appendChild(div);
            });
            document.getElementById('day-vol').innerText = Math.round(vol);
            save();
        }

        function updateW(id, field, val) {
            const item = appData.weeklyWorkouts[currentDay].find(x => x.id === id);
            if(item) {
                item[field] = val; // 保持为字符串，防止输入中断
                renderWorkouts();
            }
        }

        function delRow(id) {
            appData.weeklyWorkouts[currentDay] = appData.weeklyWorkouts[currentDay].filter(x => x.id !== id);
            renderWorkouts();
        }

        function searchFood() {
            const q = document.getElementById('food-search').value;
            const res = document.getElementById('food-results');
            res.innerHTML = '';
            if(!q) return;
            foodDB.filter(f => f.name.includes(q)).forEach(f => {
                const div = document.createElement('div');
                div.className = "glass p-4 space-y-3";
                div.innerHTML = `
                    <div class="flex justify-between text-xs font-bold border-b border-white/5 pb-2">
                        <span>${f.name} <small class="text-gray-500 font-normal">/ 100g计</small></span>
                        <span class="text-gray-400">P:${f.p}g C:${f.c}g F:${f.f}g</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="number" id="amt-${f.name}" placeholder="摄入克数 (g)">
                        <button onclick="addCustomFood('${f.name}')" class="bg-green-500 text-black px-4 rounded-lg font-bold text-xs">添加</button>
                    </div>`;
                res.appendChild(div);
            });
        }

        function addCustomFood(name) {
            const food = foodDB.find(f => f.name === name);
            const amt = parseFloat(document.getElementById('amt-'+name).value) || 0;
            if(amt <= 0) return;
            const r = amt / 100;
            appData.dailyNutri.p += food.p * r;
            appData.dailyNutri.c += food.c * r;
            appData.dailyNutri.f += food.f * r;
            appData.dailyNutri.kcal += food.k * r;
            updateNutriUI();
            save();
            document.getElementById('food-search').value = '';
            document.getElementById('food-results').innerHTML = '';
        }

        function updateNutriUI() {
            const n = appData.dailyNutri;
            const maxK = parseFloat(document.getElementById('max-kcal').innerText) || 1;
            document.getElementById('curr-kcal').innerText = Math.round(n.kcal);
            document.getElementById('p-stat').innerText = Math.round(n.p) + 'g';
            document.getElementById('c-stat').innerText = Math.round(n.c) + 'g';
            document.getElementById('f-stat').innerText = Math.round(n.f) + 'g';
            document.getElementById('kcal-bar').style.width = Math.min((n.kcal/maxK)*100, 100) + '%';
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('nav-active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.getElementById('nav-' + id).classList.add('nav-active');
        }

        function save() { localStorage.setItem('iron_stable_v9', JSON.stringify(appData)); }
        function resetData() { if(confirm('清空所有数据？')) { localStorage.clear(); location.reload(); } }

        window.onload = () => {
            const saved = localStorage.getItem('iron_stable_v9');
            if(saved) {
                appData = JSON.parse(saved);
                document.getElementById('height').value = appData.h || '';
                document.getElementById('weight').value = appData.w || '';
                document.getElementById('carb-cycle').value = appData.carbMode || 'none';
            }
            switchDay(currentDay);
            updateBase();
        };
    </script>
</body>
</html>
