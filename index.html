<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Matrix | 训练容量实验室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #39FF14; --glass: rgba(255, 255, 255, 0.03); }
        body { background: #000; color: #E5E5E7; font-family: system-ui, sans-serif; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; }
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; padding: 6px; outline: none; font-size: 13px; }
        input:focus { border-color: var(--neon); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-item.active { color: var(--neon); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-2xl mx-auto pb-44"> <div id="tab-train" class="tab-content active space-y-6">
            <header class="flex justify-between items-center px-2 pt-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tighter">TRAINING LOG</h1>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest">今日总容量: <span id="total-volume" class="text-green-400">0</span> KG</p>
                </div>
                <button onclick="addWorkoutRow()" class="bg-white text-black text-[10px] px-3 py-2 rounded-full font-black hover:bg-green-400 transition-colors">+ 添加动作</button>
            </header>

            <section class="glass-panel overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-white/5 text-gray-500 uppercase">
                            <tr>
                                <th class="p-4 font-medium">动作名称</th>
                                <th class="p-4 font-medium">重量 (KG)</th>
                                <th class="p-4 font-medium">组数</th>
                                <th class="p-4 font-medium">次数</th>
                                <th class="p-4 font-medium text-right">容量</th>
                                <th class="p-4"></th>
                            </tr>
                        </thead>
                        <tbody id="workout-body">
                            </tbody>
                    </table>
                </div>
                <div id="empty-hint" class="p-12 text-center text-gray-600 text-xs hidden">点击右上角添加今日训练</div>
            </section>

            <section class="glass-panel p-4 flex justify-around text-center">
                <div><div class="text-[8px] text-gray-500 uppercase">Bench PR</div><div class="text-sm font-mono" id="ref-bp">90</div></div>
                <div><div class="text-[8px] text-gray-500 uppercase">Squat PR</div><div class="text-sm font-mono" id="ref-sq">150</div></div>
                <div><div class="text-[8px] text-gray-500 uppercase">Deadlift PR</div><div class="text-sm font-mono" id="ref-dl">160</div></div>
            </section>
        </div>

        <div id="tab-data" class="tab-content space-y-6">
            <h2 class="text-xl font-bold px-2">基础参数设置</h2>
            <section class="glass-panel p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] text-gray-500 uppercase">体重 (KG)</label>
                        <input type="number" id="weight" value="75" class="w-full" oninput="saveBaseData()">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] text-gray-500 uppercase">身高 (CM)</label>
                        <input type="number" id="height" value="175" class="w-full" oninput="saveBaseData()">
                    </div>
                </div>
                <div class="space-y-3 pt-4 border-t border-white/5">
                    <div class="flex justify-between items-center text-sm">卧推 PR<input type="number" id="bp-pr" value="90" class="w-24" oninput="saveBaseData()"></div>
                    <div class="flex justify-between items-center text-sm">深蹲 PR<input type="number" id="sq-pr" value="150" class="w-24" oninput="saveBaseData()"></div>
                    <div class="flex justify-between items-center text-sm">硬拉 PR<input type="number" id="dl-pr" value="160" class="w-24" oninput="saveBaseData()"></div>
                </div>
            </section>
        </div>

        <div id="tab-food" class="tab-content space-y-6">
            <h2 class="text-xl font-bold px-2">饮食监控</h2>
            <section class="glass-panel p-6">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs text-gray-500">蛋白质摄入进度</span>
                    <span class="text-sm font-mono"><span id="curr-prot">0</span> / <span id="target-prot">150</span>g</span>
                </div>
                <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                    <div id="prot-bar" class="h-full bg-green-500 transition-all duration-500 w-0"></div>
                </div>
            </section>
            <section class="glass-panel p-6">
                <input type="text" id="food-search" placeholder="搜索食材 (鸡胸肉, 鸡蛋...)" class="w-full mb-4" oninput="searchFood()">
                <div id="food-res" class="space-y-2"></div>
            </section>
        </div>

    </div>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass-panel py-4 px-6 flex justify-between items-center shadow-2xl z-50 border-white/20">
        <div class="nav-item active flex flex-col items-center gap-1" onclick="switchTab('train')">
            <span class="text-lg">🏋️</span><span class="text-[8px] uppercase">训练</span>
        </div>
        <div class="nav-item flex flex-col items-center gap-1" onclick="switchTab('food')">
            <span class="text-lg">🥗</span><span class="text-[8px] uppercase">食谱</span>
        </div>
        <div class="nav-item flex flex-col items-center gap-1" onclick="switchTab('data')">
            <span class="text-lg">📊</span><span class="text-[8px] uppercase">数据</span>
        </div>
        <div class="nav-item flex flex-col items-center gap-1 text-gray-600" onclick="resetData()">
            <span class="text-lg">⚙️</span><span class="text-[8px] uppercase">重置</span>
        </div>
    </nav>

    <script>
        let workouts = [];
        let protein = 0;
        const foodDB = [
            { name: "鸡胸肉", p: 30 }, { name: "鸡蛋", p: 6 }, { name: "蛋白粉", p: 22 }, { name: "牛肉", p: 26 }
        ];

        function addWorkoutRow(name = "", weight = 0, sets = 0, reps = 0) {
            const id = Date.now();
            const rowData = { id, name, weight, sets, reps };
            workouts.push(rowData);
            renderWorkouts();
        }

        function renderWorkouts() {
            const body = document.getElementById('workout-body');
            body.innerHTML = '';
            let totalVol = 0;

            workouts.forEach((w, index) => {
                const vol = w.weight * w.sets * w.reps;
                totalVol += vol;
                const tr = document.createElement('tr');
                tr.className = "border-t border-white/5";
                tr.innerHTML = `
                    <td class="p-2 pl-4"><input type="text" value="${w.name}" oninput="updateWorkout(${w.id}, 'name', this.value)" class="w-20 bg-transparent border-none p-0 focus:ring-0"></td>
                    <td class="p-2"><input type="number" value="${w.weight}" oninput="updateWorkout(${w.id}, 'weight', this.value)" class="w-12"></td>
                    <td class="p-2"><input type="number" value="${w.sets}" oninput="updateWorkout(${w.id}, 'sets', this.value)" class="w-10"></td>
                    <td class="p-2"><input type="number" value="${w.reps}" oninput="updateWorkout(${w.id}, 'reps', this.value)" class="w-10"></td>
                    <td class="p-2 text-right font-mono text-green-500">${vol}</td>
                    <td class="p-2 text-right pr-4"><button onclick="removeWorkout(${w.id})" class="text-gray-600 hover:text-red-500 text-lg">×</button></td>
                `;
                body.appendChild(tr);
            });

            document.getElementById('total-volume').innerText = totalVol;
            document.getElementById('empty-hint').style.display = workouts.length === 0 ? 'block' : 'none';
            saveAll();
        }

        function updateWorkout(id, field, value) {
            const w = workouts.find(x => x.id === id);
            if (w) {
                w[field] = field === 'name' ? value : parseFloat(value) || 0;
                renderWorkouts();
            }
        }

        function removeWorkout(id) {
            workouts = workouts.filter(x => x.id !== id);
            renderWorkouts();
        }

        // 基础数据与营养
        function saveBaseData() {
            const w = document.getElementById('weight').value;
            const target = w * 2;
            document.getElementById('target-prot').innerText = target;
            document.getElementById('ref-bp').innerText = document.getElementById('bp-pr').value;
            document.getElementById('ref-sq').innerText = document.getElementById('sq-pr').value;
            document.getElementById('ref-dl').innerText = document.getElementById('dl-pr').value;
            updateProtBar(target);
            saveAll();
        }

        function updateProtBar(target) {
            const percent = Math.min((protein / target) * 100, 100);
            document.getElementById('prot-bar').style.width = percent + '%';
            document.getElementById('curr-prot').innerText = protein;
        }

        function searchFood() {
            const q = document.getElementById('food-search').value;
            const res = document.getElementById('food-res');
            res.innerHTML = '';
            if(!q) return;
            foodDB.filter(f => f.name.includes(q)).forEach(f => {
                const d = document.createElement('div');
                d.className = "flex justify-between items-center p-3 bg-white/5 rounded-xl text-xs";
                d.innerHTML = `<span>${f.name} <small class="text-gray-500">${f.p}g蛋白</small></span>
                               <button onclick="protein+=${f.p}; saveBaseData()" class="text-green-500">+添加</button>`;
                res.appendChild(d);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function saveAll() {
            const data = {
                workouts, protein,
                base: {
                    h: document.getElementById('height').value,
                    w: document.getElementById('weight').value,
                    bp: document.getElementById('bp-pr').value,
                    sq: document.getElementById('sq-pr').value,
                    dl: document.getElementById('dl-pr').value
                }
            };
            localStorage.setItem('iron_v5_final', JSON.stringify(data));
        }

        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('iron_v5_final'));
            if(saved) {
                workouts = saved.workouts || [];
                protein = saved.protein || 0;
                document.getElementById('height').value = saved.base.h;
                document.getElementById('weight').value = saved.base.w;
                document.getElementById('bp-pr').value = saved.base.bp;
                document.getElementById('sq-pr').value = saved.base.sq;
                document.getElementById('dl-pr').value = saved.base.dl;
            }
            renderWorkouts();
            saveBaseData();
        };

        function resetData() { if(confirm('清空所有记录？')) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
