<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Matrix | 数字化健身实验室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #39FF14; }
        body { background: #000; color: #E5E5E7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        /* 深度优化输入框，确保汉字和数字输入不受阻碍 */
        input { 
            background: #111 !important; 
            border: 1px solid #333 !important; 
            color: #fff !important; 
            padding: 10px !important; 
            border-radius: 8px !important;
            outline: none !important;
        }
        input:focus { border-color: var(--neon) !important; box-shadow: 0 0 8px rgba(57, 255, 20, 0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-active { color: var(--neon); border-top: 2px solid var(--neon); }
    </style>
</head>
<body class="p-4 pb-40">

    <div class="max-w-2xl mx-auto">
        
        <div id="tab-data" class="tab-content active space-y-6">
            <header class="py-6">
                <h1 class="text-2xl font-black italic tracking-tighter text-white uppercase">Body Metrics</h1>
                <p class="text-xs text-gray-500">第一步：输入你的基础数据以启动计算</p>
            </header>

            <section class="glass p-6 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] uppercase text-gray-500 font-bold">身高 (cm)</label>
                        <input type="number" id="height" placeholder="175" oninput="updateCore()">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] uppercase text-gray-500 font-bold">体重 (kg)</label>
                        <input type="number" id="weight" placeholder="75" oninput="updateCore()">
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-4 pt-4 border-t border-white/5">
                    <div class="flex flex-col gap-2 text-center">
                        <label class="text-[10px] text-gray-500 uppercase">卧推 PR</label>
                        <input type="number" id="bp-pr" placeholder="90" oninput="updateCore()" class="text-center">
                    </div>
                    <div class="flex flex-col gap-2 text-center">
                        <label class="text-[10px] text-gray-500 uppercase">深蹲 PR</label>
                        <input type="number" id="sq-pr" placeholder="150" oninput="updateCore()" class="text-center">
                    </div>
                    <div class="flex flex-col gap-2 text-center">
                        <label class="text-[10px] text-gray-500 uppercase">硬拉 PR</label>
                        <input type="number" id="dl-pr" placeholder="160" oninput="updateCore()" class="text-center">
                    </div>
                </div>
            </section>

            <section class="glass p-6 flex justify-between items-center">
                <div class="text-xs text-gray-400">预估每日总消耗 ($TDEE$)</div>
                <div class="text-2xl font-mono text-white"><span id="tdee-val">0</span> <small class="text-[10px] text-gray-600">KCAL</small></div>
            </section>
        </div>

        <div id="tab-train" class="tab-content space-y-6">
            <header class="py-6 flex justify-between items-end">
                <div>
                    <h1 class="text-2xl font-black italic tracking-tighter text-white uppercase">Training Matrix</h1>
                    <p class="text-xs text-gray-500">今日总容量: <span id="total-vol" class="text-green-500">0</span> kg</p>
                </div>
                <button onclick="addRow()" class="bg-white text-black px-4 py-2 rounded-lg text-xs font-bold hover:bg-green-500 transition-all">+ 增加动作</button>
            </header>

            <div id="workout-list" class="space-y-4">
                </div>
            
            <div id="empty-state" class="text-center py-20 text-gray-600 text-sm italic">
                列表为空，点击上方“增加动作”开始记录
            </div>
        </div>

        <div id="tab-food" class="tab-content space-y-6">
            <header class="py-6">
                <h1 class="text-2xl font-black italic tracking-tighter text-white uppercase">Nutrition</h1>
                <p class="text-xs text-gray-500">蛋白质摄入追踪</p>
            </header>
            <section class="glass p-6">
                <div class="flex justify-between text-xs mb-2">
                    <span>当前摄入: <b id="p-count">0</b>g</span>
                    <span>目标: <b id="p-target">0</b>g</span>
                </div>
                <div class="h-2 w-full bg-white/5 rounded-full overflow-hidden">
                    <div id="p-bar" class="h-full bg-green-500 transition-all duration-500" style="width: 0%"></div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-6">
                    <input type="number" id="p-input" placeholder="输入蛋白质克数">
                    <button onclick="addP()" class="bg-green-500 text-black font-bold rounded-lg">手动添加</button>
                </div>
            </section>
        </div>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-[#0a0a0a] border-t border-white/10 flex justify-around p-3 z-50">
        <button onclick="showTab('data')" id="nav-data" class="flex flex-col items-center gap-1 text-gray-500 transition-all">
            <span class="text-xl">📊</span><span class="text-[10px]">数据</span>
        </button>
        <button onclick="showTab('train')" id="nav-train" class="flex flex-col items-center gap-1 text-gray-500 transition-all">
            <span class="text-xl">🏋️</span><span class="text-[10px]">训练</span>
        </button>
        <button onclick="showTab('food')" id="nav-food" class="flex flex-col items-center gap-1 text-gray-500 transition-all">
            <span class="text-xl">🥩</span><span class="text-[10px]">饮食</span>
        </button>
    </nav>

    <script>
        let appData = { h:175, w:75, bp:90, sq:150, dl:160, protein:0, workouts:[] };

        function updateCore() {
            appData.h = document.getElementById('height').value || 0;
            appData.w = document.getElementById('weight').value || 0;
            appData.bp = document.getElementById('bp-pr').value || 0;
            appData.sq = document.getElementById('sq-pr').value || 0;
            appData.dl = document.getElementById('dl-pr').value || 0;
            
            // TDEE: Mifflin-St Jeor
            const tdee = Math.round((10 * appData.w + 6.25 * appData.h - 5 * 25 + 5) * 1.4);
            document.getElementById('tdee-val').innerText = tdee;
            document.getElementById('p-target').innerText = appData.w * 2;
            updatePBar();
            save();
        }

        function addRow() {
            appData.workouts.push({ id:Date.now(), name:'', weight:0, sets:0, reps:0 });
            renderWorkouts();
        }

        function renderWorkouts() {
            const list = document.getElementById('workout-list');
            list.innerHTML = '';
            let total = 0;
            
            appData.workouts.forEach(w => {
                const vol = w.weight * w.sets * w.reps;
                total += vol;
                const div = document.createElement('div');
                div.className = "glass p-4 space-y-4 relative";
                div.innerHTML = `
                    <button onclick="delRow(${w.id})" class="absolute top-2 right-2 text-gray-600 text-lg">×</button>
                    <input type="text" value="${w.name}" onchange="updateW(${w.id},'name',this.value)" placeholder="动作名称 (如: 卧推)" class="w-full font-bold">
                    <div class="grid grid-cols-3 gap-2">
                        <div><small class="text-[10px] text-gray-500">重量(KG)</small><input type="number" value="${w.weight}" oninput="updateW(${w.id},'weight',this.value)" class="w-full"></div>
                        <div><small class="text-[10px] text-gray-500">组数</small><input type="number" value="${w.sets}" oninput="updateW(${w.id},'sets',this.value)" class="w-full"></div>
                        <div><small class="text-[10px] text-gray-500">次数</small><input type="number" value="${w.reps}" oninput="updateW(${w.id},'reps',this.value)" class="w-full"></div>
                    </div>
                    <div class="text-right text-[10px] text-green-500 font-mono">单项容量: ${vol} KG</div>
                `;
                list.appendChild(div);
            });
            document.getElementById('total-vol').innerText = total;
            document.getElementById('empty-state').style.display = appData.workouts.length ? 'none' : 'block';
            save();
        }

        function updateW(id, field, val) {
            const item = appData.workouts.find(x => x.id === id);
            if(item) {
                item[field] = field === 'name' ? val : (parseFloat(val) || 0);
                renderWorkouts();
            }
        }

        function delRow(id) {
            appData.workouts = appData.workouts.filter(x => x.id !== id);
            renderWorkouts();
        }

        function addP() {
            const val = parseFloat(document.getElementById('p-input').value) || 0;
            appData.protein += val;
            document.getElementById('p-input').value = '';
            updatePBar();
            save();
        }

        function updatePBar() {
            const target = appData.w * 2;
            const pct = Math.min((appData.protein / target) * 100, 100);
            document.getElementById('p-count').innerText = appData.protein;
            document.getElementById('p-bar').style.width = pct + '%';
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById('tab-' + id).classList.add('active');
            document.getElementById('nav-' + id).classList.add('nav-active');
        }

        function save() { localStorage.setItem('iron_final_v6', JSON.stringify(appData)); }

        window.onload = () => {
            const saved = localStorage.getItem('iron_final_v6');
            if(saved) {
                appData = JSON.parse(saved);
                document.getElementById('height').value = appData.h;
                document.getElementById('weight').value = appData.w;
                document.getElementById('bp-pr').value = appData.bp;
                document.getElementById('sq-pr').value = appData.sq;
                document.getElementById('dl-pr').value = appData.dl;
            }
            showTab('data'); // 强制默认打开数据页
            updateCore();
            renderWorkouts();
        }
    </script>
</body>
</html>
