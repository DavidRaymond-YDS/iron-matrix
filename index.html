<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Matrix | 极简训练看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #39FF14; }
        body { background: #000; color: #eee; font-family: 'Inter', sans-serif; }
        .glass { 
            background: #111; 
            border: 1px solid #222; 
            border-radius: 20px; 
            padding: 24px; 
            transition: border-color 0.3s;
        }
        .glass:hover { border-color: #333; }
        /* 针对电脑端优化输入框 */
        input[type="number"] { 
            background: #1a1a1a; 
            border: 1px solid #333; 
            color: var(--neon); 
            border-radius: 8px; 
            padding: 8px; 
            width: 100px; 
            font-family: monospace;
            font-size: 1.1rem;
            outline: none;
        }
        input[type="number"]:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(57, 255, 20, 0.2); }
        .btn-neon { 
            border: 1px solid var(--neon); 
            color: var(--neon); 
            padding: 8px 16px; 
            border-radius: 12px; 
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-neon:hover { background: var(--neon); color: #000; cursor: pointer; }
    </style>
</head>
<body class="p-6 pb-24">

    <div class="max-w-md mx-auto space-y-8">
        <header class="flex justify-between items-center py-4">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-white">IRON MATRIX</h1>
                <p class="text-[10px] text-gray-500 tracking-[0.2em]">PRECISION TRAINING V1.0</p>
            </div>
            <button onclick="resetData()" class="text-gray-700 hover:text-red-500 transition-colors text-xs">RESET</button>
        </header>

        <section class="glass">
            <h3 class="text-[10px] text-gray-500 uppercase mb-6 tracking-[0.3em] font-bold">身体参数</h3>
            <div class="grid grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="block text-xs text-gray-400">身高 (CM)</label>
                    <input type="number" id="height" value="175" step="0.5">
                </div>
                <div class="space-y-2">
                    <label class="block text-xs text-gray-400">体重 (KG)</label>
                    <input type="number" id="weight" value="75" step="0.1">
                </div>
            </div>
            <div class="mt-8 pt-6 border-t border-gray-800/50 flex justify-between items-end">
                <span class="text-sm text-gray-400 font-light">日消耗 $TDEE$:</span>
                <span class="text-3xl font-mono text-white leading-none"><span id="tdee-res">2450</span> <small class="text-[10px] text-gray-600 uppercase">kcal</small></span>
            </div>
        </section>

        <section class="glass">
            <h3 class="text-[10px] text-gray-500 uppercase mb-6 tracking-[0.3em] font-bold">PR 矩阵</h3>
            <div class="space-y-6">
                <div class="flex justify-between items-center group">
                    <span class="text-sm text-gray-400 group-hover:text-white transition-colors">卧推 Bench Press</span>
                    <input type="number" id="bp" value="90">
                </div>
                <div class="flex justify-between items-center group">
                    <span class="text-sm text-gray-400 group-hover:text-white transition-colors">深蹲 Squat</span>
                    <input type="number" id="sq" value="150">
                </div>
                <div class="flex justify-between items-center group">
                    <span class="text-sm text-gray-400 group-hover:text-white transition-colors">硬拉 Deadlift</span>
                    <input type="number" id="dl" value="160">
                </div>
            </div>
        </section>

        <section class="glass bg-white/[0.02]">
            <h3 class="text-[10px] text-green-500 uppercase mb-6 font-bold tracking-[0.3em]">建议训练重量 (75% 1RM)</h3>
            <div id="plan" class="space-y-3 font-mono text-sm">
                </div>
        </section>

        <section class="glass">
            <h3 class="text-[10px] text-gray-500 uppercase mb-6 tracking-[0.3em] font-bold">快捷营养</h3>
            <div class="flex gap-3 flex-wrap mb-8">
                <div onclick="addProtein(25)" class="btn-neon">胸肉 +25g</div>
                <div onclick="addProtein(6)" class="btn-neon">鸡蛋 +6g</div>
                <div onclick="addProtein(22)" class="btn-neon">粉类 +22g</div>
            </div>
            <div class="relative h-2 bg-gray-900 rounded-full overflow-hidden mb-2">
                <div id="prot-bar" class="absolute top-0 left-0 h-full bg-green-500 transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex justify-between items-center text-[10px] font-mono text-gray-500">
                <span>PROTEIN INTAKE</span>
                <span class="text-white text-sm"><span id="prot-count">0</span> / <span id="prot-target">150</span>g</span>
            </div>
        </section>
    </div>

    <script>
        let protein = 0;
        const inputs = ['height', 'weight', 'bp', 'sq', 'dl'];

        // 核心逻辑：监听所有输入变化
        function initApp() {
            inputs.forEach(id => {
                const el = document.getElementById(id);
                // 监听键盘输入、鼠标点击箭头、粘贴等所有行为
                el.addEventListener('input', calculateEverything);
            });
            loadData();
        }

        function calculateEverything() {
            const h = parseFloat(document.getElementById('height').value) || 0;
            const w = parseFloat(document.getElementById('weight').value) || 0;
            const bp = parseFloat(document.getElementById('bp').value) || 0;
            const sq = parseFloat(document.getElementById('sq').value) || 0;
            const dl = parseFloat(document.getElementById('dl').value) || 0;

            // 1. TDEE 计算 (Mifflin-St Jeor 公式, 假设活动系数 1.375)
            const bmr = 10 * w + 6.25 * h - 5 * 25 + 5;
            const tdee = Math.round(bmr * 1.375);
            document.getElementById('tdee-res').innerText = tdee || 0;

            // 2. 蛋白质目标 (体重 x 2)
            const protTarget = Math.round(w * 2);
            document.getElementById('prot-target').innerText = protTarget || 150;
            const percent = Math.min((protein / protTarget) * 100, 100);
            document.getElementById('prot-bar').style.width = percent + '%';

            // 3. 力量方案
            document.getElementById('plan').innerHTML = `
                <div class="flex justify-between border-b border-white/5 pb-2"><span>卧推 (5-8回):</span> <span class="text-white">${(bp*0.75).toFixed(1)} kg</span></div>
                <div class="flex justify-between border-b border-white/5 pb-2"><span>深蹲 (8-10回):</span> <span class="text-white">${(sq*0.7).toFixed(1)} kg</span></div>
                <div class="flex justify-between border-b border-white/5 pb-2"><span>硬拉 (3-5回):</span> <span class="text-white">${(dl*0.8).toFixed(1)} kg</span></div>
            `;

            // 4. 保存到本地
            saveData({h, w, bp, sq, dl, protein});
        }

        function addProtein(amt) {
            protein += amt;
            document.getElementById('prot-count').innerText = protein;
            calculateEverything();
        }

        function saveData(data) {
            localStorage.setItem('iron_matrix_v2', JSON.stringify(data));
        }

        function loadData() {
            const saved = JSON.parse(localStorage.getItem('iron_matrix_v2'));
            if(saved) {
                document.getElementById('height').value = saved.h;
                document.getElementById('weight').value = saved.w;
                document.getElementById('bp').value = saved.bp;
                document.getElementById('sq').value = saved.sq;
                document.getElementById('dl').value = saved.dl;
                protein = saved.protein || 0;
                document.getElementById('prot-count').innerText = protein;
            }
            calculateEverything();
        }

        function resetData() {
            if(confirm('重置所有数据？')) {
                localStorage.clear();
                location.reload();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
